services:
  db:
    image: postgres:16-alpine
    container_name: scoutlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scoutlens}
      POSTGRES_USER: ${POSTGRES_USER:-scoutlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scoutlens_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - scoutlens_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scoutlens} -d ${POSTGRES_DB:-scoutlens}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  scoutlens_postgres_data:

