[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "footyscout-backend"
version = "0.1.0"
description = "FastAPI backend and football analytics workspace for FootyScout"
readme = { text = "FootyScout FastAPI backend and football analytics workspace.", content-type = "text/markdown" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
analytics = [
    "joblib>=1.4,<2.0",
    "matplotlib>=3.11,<4.0",
    "numpy>=2.1,<3.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=25.0,<26.0",
    "scipy>=1.15,<2.0",
    "scikit-learn>=1.6,<2.0",
    "statsbombpy>=1.22,<2.0",
    "torch>=2.14,<3.0",
    "xgboost==3.4.1",
]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "analytics*", "scripts*"]

[tool.setuptools.package-data]
app = ["runtime_metadata/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "artifacts: integration contract requires locally generated analytics artifacts",
]

[tool.ruff]
target-version = "py312"
line-length = 100
